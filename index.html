<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniLog — Anime Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --surface3: #22223a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f5;
    --text2: #9090b0;
    --text3: #5a5a7a;
    --accent: #e84393;
    --accent2: #7c3aed;
    --accent3: #06b6d4;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --orange: #f97316;
    --tier-s: #ef4444;
    --tier-a: #f97316;
    --tier-b: #eab308;
    --tier-c: #22c55e;
    --tier-d: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; }
  .logo span { color: var(--accent); }
  .header-stats { display: flex; gap: 2rem; }
  .hstat { text-align: center; }
  .hstat-num { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent3); }
  .hstat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #d1306f; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
  .btn-ghost:hover { background: var(--surface3); color: var(--text); }

  /* NAV TABS */
  .nav { display: flex; gap: 0; padding: 0 2rem; background: var(--surface); border-bottom: 1px solid var(--border); }
  .nav-tab { padding: 14px 20px; font-size: 13px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; user-select: none; }
  .nav-tab:hover { color: var(--text2); }
  .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* MAIN LAYOUT */
  main { padding: 2rem; max-width: 1400px; margin: 0 auto; }

  /* TOOLBAR */
  .toolbar { display: flex; gap: 12px; margin-bottom: 2rem; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px 9px 38px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border 0.15s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
  select { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; cursor: pointer; }
  select:focus { border-color: var(--accent); }
  .sort-btns { display: flex; gap: 4px; }
  .sort-btn { padding: 8px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text2); font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .sort-btn.active, .sort-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }

  /* STATUS FILTER PILLS */
  .status-pills { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .pill { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); color: var(--text3); transition: all 0.15s; user-select: none; }
  .pill:hover { color: var(--text2); border-color: var(--border2); }
  .pill.active-pill { color: #fff; border-color: transparent; }
  .pill[data-status="All"].active-pill { background: var(--accent2); }
  .pill[data-status="Watching"].active-pill { background: var(--accent3); }
  .pill[data-status="Completed"].active-pill { background: var(--green); }
  .pill[data-status="Plan to Watch"].active-pill { background: var(--accent2); }
  .pill[data-status="Dropped"].active-pill { background: var(--red); }
  .pill[data-status="On Hold"].active-pill { background: var(--orange); }

  /* CARD GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: all 0.2s; cursor: pointer; position: relative; }
  .card:hover { border-color: var(--border2); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  .card-cover { height: 160px; background: var(--surface3); position: relative; overflow: hidden; }
  .card-cover img { width: 100%; height: 100%; object-fit: cover; }
  .card-cover-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--text3); }
  .card-tier-badge { position: absolute; top: 8px; left: 8px; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 16px; font-weight: 700; color: #fff; }
  .card-status-dot { position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
  .status-Watching { background: rgba(6,182,212,0.25); color: var(--accent3); }
  .status-Completed { background: rgba(16,185,129,0.25); color: var(--green); }
  .status-Dropped { background: rgba(239,68,68,0.25); color: var(--red); }
  .status-Plan { background: rgba(124,58,237,0.25); color: #a78bfa; }
  .status-Hold { background: rgba(249,115,22,0.25); color: var(--orange); }
  .card-body { padding: 14px; }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-genres { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; min-height: 20px; }
  .genre-tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--surface3); color: var(--text2); }
  .card-rating { display: flex; align-items: center; gap: 6px; }
  .stars { display: flex; gap: 2px; }
  .star { font-size: 12px; color: var(--text3); }
  .star.filled { color: var(--gold); }
  .rating-num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--text); }
  .card-actions { display: flex; gap: 6px; margin-top: 10px; }
  .card-btn { flex: 1; padding: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 11px; cursor: pointer; transition: all 0.15s; text-align: center; }
  .card-btn:hover { background: var(--surface3); color: var(--text); }
  .card-btn.danger:hover { background: rgba(239,68,68,0.15); color: var(--red); border-color: rgba(239,68,68,0.3); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 6rem 2rem; }
  .empty-icon { font-size: 64px; margin-bottom: 1rem; }
  .empty h3 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; margin-bottom: 8px; color: var(--text2); }
  .empty p { color: var(--text3); font-size: 14px; }

  /* MODAL OVERLAY */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  .overlay.hidden { display: none; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; animation: modalIn 0.2s ease; }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; }
  .modal-close { width: 32px; height: 32px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 18px; transition: all 0.15s; }
  .modal-close:hover { background: var(--surface3); color: var(--text); }
  .modal-body { padding: 20px 24px 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select, .form-group textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border 0.15s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .rating-selector { display: flex; gap: 4px; }
  .rating-star { font-size: 24px; cursor: pointer; color: var(--text3); transition: color 0.1s; user-select: none; }
  .rating-star:hover, .rating-star.active { color: var(--gold); }
  .tier-selector { display: flex; gap: 8px; }
  .tier-opt { width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 22px; cursor: pointer; border: 2px solid transparent; opacity: 0.5; transition: all 0.15s; color: #fff; }
  .tier-opt:hover, .tier-opt.selected { opacity: 1; border-color: #fff; transform: scale(1.1); }
  .tier-opt[data-tier="S"] { background: var(--tier-s); }
  .tier-opt[data-tier="A"] { background: var(--tier-a); }
  .tier-opt[data-tier="B"] { background: var(--tier-b); }
  .tier-opt[data-tier="C"] { background: var(--tier-c); }
  .tier-opt[data-tier="D"] { background: var(--tier-d); }
  .tier-opt[data-tier="?"] { background: var(--surface3); color: var(--text3); }
  .genre-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .genre-chip { padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); color: var(--text3); transition: all 0.12s; user-select: none; }
  .genre-chip.selected { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; }
  .ep-row { display: flex; gap: 8px; align-items: center; }
  .ep-row input { flex: 1; }
  .ep-row span { color: var(--text3); font-size: 13px; }

  /* DETAIL MODAL */
  .detail-cover { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; background: var(--surface3); }
  .detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .meta-item label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 3px; }
  .meta-item span { font-size: 14px; font-weight: 500; }
  .notes-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.7; color: var(--text2); margin-top: 8px; min-height: 60px; white-space: pre-wrap; }
  .yt-ideas-box { background: rgba(232,67,147,0.07); border: 1px solid rgba(232,67,147,0.2); border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.7; color: var(--text2); margin-top: 8px; min-height: 40px; white-space: pre-wrap; }
  .section-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; margin-top: 16px; display: flex; align-items: center; gap: 6px; }
  .section-label svg { color: var(--accent); }

  /* TIER LIST VIEW */
  .tier-section { margin-bottom: 20px; }
  .tier-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .tier-label { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #fff; flex-shrink: 0; }
  .tier-count { font-size: 12px; color: var(--text3); }
  .tier-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .tier-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.15s; }
  .tier-card:hover { background: var(--surface3); border-color: var(--border2); }
  .tier-card-thumb { width: 36px; height: 36px; border-radius: 6px; background: var(--surface3); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--text3); }
  .tier-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tier-card-info { overflow: hidden; }
  .tier-card-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tier-card-rating { font-size: 11px; color: var(--gold); }
  .tier-empty { color: var(--text3); font-size: 13px; font-style: italic; padding: 8px 0; }

  /* STATS VIEW */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 2rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 40px; line-height: 1; color: var(--accent3); margin-bottom: 4px; }
  .stat-label { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
  .chart-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; color: var(--text2); }
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-label { font-size: 12px; color: var(--text2); min-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: var(--surface3); border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.6s ease; }
  .bar-val { font-size: 12px; color: var(--text3); min-width: 24px; text-align: right; }
  .donut-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .rating-dist { display: flex; align-items: flex-end; gap: 6px; height: 100px; }
  .rd-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rd-bar { width: 100%; background: var(--accent2); border-radius: 4px 4px 0 0; min-height: 4px; transition: height 0.4s ease; }
  .rd-label { font-size: 10px; color: var(--text3); }

  /* EXPORT BTN */
  .export-bar { display: flex; gap: 10px; margin-bottom: 1.5rem; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text); z-index: 500; animation: toastIn 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  .toast.hidden { display: none; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    header { padding: 0 1rem; }
    main { padding: 1rem; }
    .header-stats { display: none; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Ani<span>Log</span></div>
  <div class="header-stats">
    <div class="hstat"><div class="hstat-num" id="hstat-total">0</div><div class="hstat-label">Total</div></div>
    <div class="hstat"><div class="hstat-num" id="hstat-completed">0</div><div class="hstat-label">Completed</div></div>
    <div class="hstat"><div class="hstat-num" id="hstat-avg">—</div><div class="hstat-label">Avg Rating</div></div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="exportData()">⬇ Export</button>
    <label class="btn btn-ghost" style="cursor:pointer">⬆ Import <input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
    <button class="btn btn-primary" onclick="openAddModal()">＋ Add Anime</button>
  </div>
</header>

<!-- NAV -->
<nav class="nav">
  <div class="nav-tab active" data-tab="library" onclick="switchTab('library')">Library</div>
  <div class="nav-tab" data-tab="tierlist" onclick="switchTab('tierlist')">Tier List</div>
  <div class="nav-tab" data-tab="stats" onclick="switchTab('stats')">Stats</div>
</nav>

<!-- MAIN -->
<main>

  <!-- LIBRARY TAB -->
  <div id="tab-library">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search anime…" oninput="renderLibrary()">
      </div>
      <select id="filter-genre" onchange="renderLibrary()">
        <option value="">All Genres</option>
      </select>
      <select id="filter-tier" onchange="renderLibrary()">
        <option value="">All Tiers</option>
        <option value="S">S Tier</option>
        <option value="A">A Tier</option>
        <option value="B">B Tier</option>
        <option value="C">C Tier</option>
        <option value="D">D Tier</option>
        <option value="?">Unranked</option>
      </select>
      <div class="sort-btns">
        <div class="sort-btn active" data-sort="added" onclick="setSort('added')">Latest</div>
        <div class="sort-btn" data-sort="rating" onclick="setSort('rating')">Rating ↓</div>
        <div class="sort-btn" data-sort="title" onclick="setSort('title')">A–Z</div>
      </div>
    </div>
    <div class="status-pills">
      <div class="pill active-pill" data-status="All" onclick="setStatus('All')">All</div>
      <div class="pill" data-status="Watching" onclick="setStatus('Watching')">Watching</div>
      <div class="pill" data-status="Completed" onclick="setStatus('Completed')">Completed</div>
      <div class="pill" data-status="Plan to Watch" onclick="setStatus('Plan to Watch')">Plan to Watch</div>
      <div class="pill" data-status="Dropped" onclick="setStatus('Dropped')">Dropped</div>
      <div class="pill" data-status="On Hold" onclick="setStatus('On Hold')">On Hold</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty-state">
      <div class="empty-icon">⛩️</div>
      <h3>No Anime Found</h3>
      <p>Add your first anime or adjust your filters</p>
    </div>
  </div>

  <!-- TIER LIST TAB -->
  <div id="tab-tierlist" class="hidden">
    <div id="tierlist-content"></div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" class="hidden">
    <div id="stats-content"></div>
  </div>

</main>

<!-- ADD/EDIT MODAL -->
<div class="overlay hidden" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Add Anime</div>
      <div class="modal-close" onclick="closeModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full">
          <label>Anime Title *</label>
          <input type="text" id="f-title" placeholder="e.g. Attack on Titan">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option>Completed</option>
            <option>Watching</option>
            <option>Plan to Watch</option>
            <option>Dropped</option>
            <option>On Hold</option>
          </select>
        </div>
        <div class="form-group">
          <label>Year</label>
          <input type="number" id="f-year" placeholder="e.g. 2013" min="1960" max="2030">
        </div>
        <div class="form-group">
          <label>Episodes Watched / Total</label>
          <div class="ep-row">
            <input type="number" id="f-ep-watched" placeholder="12" min="0">
            <span>/</span>
            <input type="number" id="f-ep-total" placeholder="24" min="0">
          </div>
        </div>
        <div class="form-group">
          <label>Studio</label>
          <input type="text" id="f-studio" placeholder="e.g. Mappa, Wit Studio">
        </div>
        <div class="form-group full">
          <label>Cover Image URL (optional)</label>
          <input type="text" id="f-cover" placeholder="https://…">
        </div>
        <div class="form-group full">
          <label>Rating (1–10)</label>
          <div class="rating-selector" id="rating-selector"></div>
        </div>
        <div class="form-group full">
          <label>Tier</label>
          <div class="tier-selector">
            <div class="tier-opt" data-tier="S" onclick="selectTier('S')">S</div>
            <div class="tier-opt" data-tier="A" onclick="selectTier('A')">A</div>
            <div class="tier-opt" data-tier="B" onclick="selectTier('B')">B</div>
            <div class="tier-opt" data-tier="C" onclick="selectTier('C')">C</div>
            <div class="tier-opt" data-tier="D" onclick="selectTier('D')">D</div>
            <div class="tier-opt selected" data-tier="?" onclick="selectTier('?')">?</div>
          </div>
        </div>
        <div class="form-group full">
          <label>Genres</label>
          <div class="genre-chips" id="genre-chips"></div>
        </div>
        <div class="form-group full">
          <label>Notes / Review</label>
          <textarea id="f-notes" placeholder="Personal thoughts, what you loved or hated…"></textarea>
        </div>
        <div class="form-group full">
          <label>💡 YouTube Ideas</label>
          <textarea id="f-ytideas" placeholder="Video concepts, talking points, memorable moments for content…"></textarea>
        </div>
        <div class="form-group">
          <label>Rewatchable?</label>
          <select id="f-rewatch">
            <option value="no">No</option>
            <option value="yes">Yes</option>
            <option value="maybe">Maybe</option>
          </select>
        </div>
        <div class="form-group">
          <label>Would Recommend?</label>
          <select id="f-recommend">
            <option value="yes">Yes</option>
            <option value="no">No</option>
            <option value="maybe">Depends</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveAnime()" style="flex:1">Save Anime</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay hidden" id="detail-overlay" onclick="handleDetailOverlayClick(event)">
  <div class="modal" id="detail-modal">
    <div class="modal-header">
      <div class="modal-title" id="detail-title">—</div>
      <div class="modal-close" onclick="closeDetail()">×</div>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast hidden" id="toast"></div>

<script>
const API = "https://skaushik90.github.io/anime-tracker/";
const GENRES = ['Action','Adventure','Comedy','Drama','Fantasy','Horror','Isekai','Mecha','Mystery','Psychological','Romance','Sci-Fi','Seinen','Shonen','Shojo','Slice of Life','Sports','Supernatural','Thriller'];
const TIER_COLORS = { S: '#ef4444', A: '#f97316', B: '#eab308', C: '#22c55e', D: '#3b82f6', '?': '#3a3a5a' };
const STATUS_CLASS = { Watching:'Watching', Completed:'Completed', Dropped:'Dropped', 'Plan to Watch':'Plan', 'On Hold':'Hold' };

let animes = JSON.parse(localStorage.getItem('anilog_v2') || '[]');
let currentSort = 'added';
let currentStatus = 'All';
let editingId = null;
let currentRating = 0;
let currentTier = '?';

function save() { localStorage.setItem('anilog_v2', JSON.stringify(animes)); updateHeaderStats(); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function updateHeaderStats() {
  document.getElementById('hstat-total').textContent = animes.length;
  document.getElementById('hstat-completed').textContent = animes.filter(a => a.status === 'Completed').length;
  const rated = animes.filter(a => a.rating > 0);
  document.getElementById('hstat-avg').textContent = rated.length ? (rated.reduce((s,a) => s + a.rating, 0) / rated.length).toFixed(1) : '—';
}

/* ===== LIBRARY ===== */
function setSort(s) {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === s));
  renderLibrary();
}
function setStatus(s) {
  currentStatus = s;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active-pill', p.dataset.status === s));
  renderLibrary();
}

function getFiltered() {
  let list = [...animes];
  const q = document.getElementById('search').value.toLowerCase();
  const genre = document.getElementById('filter-genre').value;
  const tier = document.getElementById('filter-tier').value;
  if (q) list = list.filter(a => a.title.toLowerCase().includes(q));
  if (genre) list = list.filter(a => a.genres && a.genres.includes(genre));
  if (tier) list = list.filter(a => a.tier === tier);
  if (currentStatus !== 'All') list = list.filter(a => a.status === currentStatus);
  if (currentSort === 'rating') list.sort((a,b) => (b.rating||0) - (a.rating||0));
  else if (currentSort === 'title') list.sort((a,b) => a.title.localeCompare(b.title));
  else list.sort((a,b) => (b.addedAt||0) - (a.addedAt||0));
  return list;
}

function renderLibrary() {
  const list = getFiltered();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty-state');
  grid.innerHTML = '';
  if (!list.length) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  list.forEach(a => {
    const div = document.createElement('div');
    div.className = 'card';
    const sc = STATUS_CLASS[a.status] || 'Plan';
    const stars = [1,2,3,4,5].map(i => `<span class="star ${(a.rating||0) >= i*2-1 ? 'filled' : ''}">${(a.rating||0) >= i*2 ? '★' : (a.rating||0) >= i*2-1 ? '⯨' : '★'}</span>`).join('');
    const tierBadge = a.tier && a.tier !== '?' ? `<div class="card-tier-badge" style="background:${TIER_COLORS[a.tier]}">${a.tier}</div>` : '';
    const genreTags = (a.genres||[]).slice(0,2).map(g => `<span class="genre-tag">${g}</span>`).join('');
    const cover = a.cover ? `<img src="${escHtml(a.cover)}" alt="" onerror="this.style.display='none'">` : `<div class="card-cover-placeholder">${a.title.charAt(0)}</div>`;
    div.innerHTML = `
      <div class="card-cover">${cover}${tierBadge}<div class="card-status-dot status-${sc}">${a.status}</div></div>
      <div class="card-body">
        <div class="card-title" title="${escHtml(a.title)}">${escHtml(a.title)}</div>
        <div class="card-genres">${genreTags}</div>
        <div class="card-rating"><div class="stars">${stars}</div><span class="rating-num">${a.rating||'—'}</span></div>
        <div class="card-actions">
          <div class="card-btn" onclick="event.stopPropagation();openDetail('${a.id}')">View</div>
          <div class="card-btn" onclick="event.stopPropagation();openEditModal('${a.id}')">Edit</div>
          <div class="card-btn danger" onclick="event.stopPropagation();deleteAnime('${a.id}')">Delete</div>
        </div>
      </div>`;
    div.onclick = () => openDetail(a.id);
    grid.appendChild(div);
  });
  refreshGenreFilter();
}

function refreshGenreFilter() {
  const sel = document.getElementById('filter-genre');
  const cur = sel.value;
  const all = new Set(); animes.forEach(a => (a.genres||[]).forEach(g => all.add(g)));
  sel.innerHTML = '<option value="">All Genres</option>' + [...all].sort().map(g => `<option value="${g}"${g===cur?' selected':''}>${g}</option>`).join('');
}

/* ===== MODAL ===== */
function buildRatingSelector() {
  const wrap = document.getElementById('rating-selector');
  wrap.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const span = document.createElement('span');
    span.className = 'rating-star' + (currentRating >= i ? ' active' : '');
    span.textContent = i <= 5 ? '★' : '◆';
    span.title = i;
    span.onmouseover = () => highlightRating(i);
    span.onmouseout = () => highlightRating(currentRating);
    span.onclick = () => { currentRating = i; highlightRating(i); };
    wrap.appendChild(span);
  }
}
function highlightRating(n) {
  document.querySelectorAll('.rating-star').forEach((s,i) => s.classList.toggle('active', i < n));
}
function buildGenreChips() {
  const wrap = document.getElementById('genre-chips');
  const selected = new Set(wrap.querySelectorAll('.genre-chip.selected') ? [...wrap.querySelectorAll('.genre-chip.selected')].map(c => c.dataset.g) : []);
  wrap.innerHTML = GENRES.map(g => `<div class="genre-chip${selected.has(g)?' selected':''}" data-g="${g}" onclick="toggleGenre(this)">${g}</div>`).join('');
}
function toggleGenre(el) { el.classList.toggle('selected'); }
function selectTier(t) {
  currentTier = t;
  document.querySelectorAll('.tier-opt').forEach(o => o.classList.toggle('selected', o.dataset.tier === t));
}

function openAddModal() {
  editingId = null; currentRating = 0; currentTier = '?';
  document.getElementById('modal-title').textContent = 'Add Anime';
  document.getElementById('f-title').value = '';
  document.getElementById('f-status').value = 'Completed';
  document.getElementById('f-year').value = '';
  document.getElementById('f-ep-watched').value = '';
  document.getElementById('f-ep-total').value = '';
  document.getElementById('f-studio').value = '';
  document.getElementById('f-cover').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-ytideas').value = '';
  document.getElementById('f-rewatch').value = 'no';
  document.getElementById('f-recommend').value = 'yes';
  buildRatingSelector();
  buildGenreChips();
  selectTier('?');
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function openEditModal(id) {
  const a = animes.find(x => x.id === id);
  if (!a) return;
  editingId = id; currentRating = a.rating||0; currentTier = a.tier||'?';
  document.getElementById('modal-title').textContent = 'Edit Anime';
  document.getElementById('f-title').value = a.title;
  document.getElementById('f-status').value = a.status;
  document.getElementById('f-year').value = a.year||'';
  document.getElementById('f-ep-watched').value = a.epWatched||'';
  document.getElementById('f-ep-total').value = a.epTotal||'';
  document.getElementById('f-studio').value = a.studio||'';
  document.getElementById('f-cover').value = a.cover||'';
  document.getElementById('f-notes').value = a.notes||'';
  document.getElementById('f-ytideas').value = a.ytIdeas||'';
  document.getElementById('f-rewatch').value = a.rewatch||'no';
  document.getElementById('f-recommend').value = a.recommend||'yes';
  buildRatingSelector();
  highlightRating(currentRating);
  buildGenreChips();
  const chips = document.querySelectorAll('.genre-chip');
  chips.forEach(c => { if ((a.genres||[]).includes(c.dataset.g)) c.classList.add('selected'); });
  selectTier(currentTier);
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
function handleOverlayClick(e) { if (e.target.id === 'modal-overlay') closeModal(); }

function saveAnime() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('Please enter a title'); return; }
  const genres = [...document.querySelectorAll('.genre-chip.selected')].map(c => c.dataset.g);
  const data = {
    title,
    status: document.getElementById('f-status').value,
    year: document.getElementById('f-year').value || null,
    epWatched: document.getElementById('f-ep-watched').value || null,
    epTotal: document.getElementById('f-ep-total').value || null,
    studio: document.getElementById('f-studio').value.trim() || null,
    cover: document.getElementById('f-cover').value.trim() || null,
    rating: currentRating,
    tier: currentTier,
    genres,
    notes: document.getElementById('f-notes').value.trim(),
    ytIdeas: document.getElementById('f-ytideas').value.trim(),
    rewatch: document.getElementById('f-rewatch').value,
    recommend: document.getElementById('f-recommend').value,
  };
  if (editingId) {
    const idx = animes.findIndex(a => a.id === editingId);
    animes[idx] = { ...animes[idx], ...data };
    showToast('Anime updated ✓');
  } else {
    animes.push({ id: uid(), addedAt: Date.now(), ...data });
    showToast('Anime added ✓');
  }
  save(); closeModal(); renderLibrary(); renderTierList(); renderStats();
}

function deleteAnime(id) {
  if (!confirm('Delete this anime?')) return;
  animes = animes.filter(a => a.id !== id);
  save(); renderLibrary(); renderTierList(); renderStats();
  showToast('Deleted');
}

/* ===== DETAIL ===== */
function openDetail(id) {
  const a = animes.find(x => x.id === id);
  if (!a) return;
  document.getElementById('detail-title').textContent = a.title;
  const epStr = a.epWatched || a.epTotal ? `${a.epWatched||'?'} / ${a.epTotal||'?'} eps` : '—';
  const rewatch = {yes:'✅ Yes', no:'❌ No', maybe:'🤔 Maybe'}[a.rewatch] || '—';
  const recommend = {yes:'👍 Yes', no:'👎 No', maybe:'🤷 Depends'}[a.recommend] || '—';
  const stars = Array.from({length:10},(_,i) => `<span style="color:${i<(a.rating||0)?'#f59e0b':'#3a3a5a'};font-size:18px">★</span>`).join('');
  const coverEl = a.cover ? `<img class="detail-cover" src="${escHtml(a.cover)}" onerror="this.style.display='none'">` : '';
  const genres = (a.genres||[]).map(g=>`<span class="genre-tag">${g}</span>`).join('') || '<span style="color:var(--text3);font-size:12px">None</span>';
  const tierEl = a.tier && a.tier!=='?' ? `<span style="background:${TIER_COLORS[a.tier]};color:#fff;padding:3px 10px;border-radius:6px;font-weight:700;font-size:13px">${a.tier} Tier</span>` : '<span style="color:var(--text3)">Unranked</span>';
  document.getElementById('detail-body').innerHTML = `
    ${coverEl}
    <div class="detail-meta">
      <div class="meta-item"><label>Status</label><span>${a.status}</span></div>
      <div class="meta-item"><label>Year</label><span>${a.year||'—'}</span></div>
      <div class="meta-item"><label>Studio</label><span>${a.studio||'—'}</span></div>
      <div class="meta-item"><label>Episodes</label><span>${epStr}</span></div>
      <div class="meta-item"><label>Rating</label><span>${stars} <strong style="font-size:18px">${a.rating||'—'}</strong>/10</span></div>
      <div class="meta-item"><label>Tier</label><span>${tierEl}</span></div>
      <div class="meta-item"><label>Rewatchable</label><span>${rewatch}</span></div>
      <div class="meta-item"><label>Recommend</label><span>${recommend}</span></div>
    </div>
    <div class="section-label"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 7h10M7 12h10M7 17h6"/></svg>Genres</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${genres}</div>
    ${a.notes ? `<div class="section-label">📝 Notes</div><div class="notes-box">${escHtml(a.notes)}</div>` : ''}
    ${a.ytIdeas ? `<div class="section-label"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> YouTube Ideas</div><div class="yt-ideas-box">${escHtml(a.ytIdeas)}</div>` : ''}
    <div style="margin-top:20px;display:flex;gap:8px">
      <button class="btn btn-primary" onclick="closeDetail();openEditModal('${a.id}')">Edit</button>
      <button class="btn btn-ghost" onclick="closeDetail()">Close</button>
    </div>`;
  document.getElementById('detail-overlay').classList.remove('hidden');
}
function closeDetail() { document.getElementById('detail-overlay').classList.add('hidden'); }
function handleDetailOverlayClick(e) { if (e.target.id === 'detail-overlay') closeDetail(); }

/* ===== TIER LIST ===== */
function renderTierList() {
  const tiers = ['S','A','B','C','D','?'];
  const c = document.getElementById('tierlist-content');
  c.innerHTML = '';
  tiers.forEach(t => {
    const list = animes.filter(a => a.tier === t);
    const sec = document.createElement('div');
    sec.className = 'tier-section';
    const cards = list.length ? list.map(a => {
      const thumb = a.cover ? `<img src="${escHtml(a.cover)}" onerror="this.parentElement.textContent='${a.title.charAt(0)}'">` : a.title.charAt(0);
      return `<div class="tier-card" onclick="openDetail('${a.id}')">
        <div class="tier-card-thumb">${a.cover?`<img src="${escHtml(a.cover)}" onerror="this.style.display='none'">`:''}${a.cover?'':a.title.charAt(0)}</div>
        <div class="tier-card-info">
          <div class="tier-card-title">${escHtml(a.title)}</div>
          ${a.rating ? `<div class="tier-card-rating">★ ${a.rating}/10</div>` : ''}
        </div>
      </div>`;
    }).join('') : '<div class="tier-empty">No anime in this tier yet</div>';
    sec.innerHTML = `<div class="tier-header">
      <div class="tier-label" style="background:${TIER_COLORS[t]}">${t}</div>
      <div style="font-size:15px;font-weight:500">${t==='?'?'Unranked':t+' Tier'}</div>
      <div class="tier-count">${list.length} anime</div>
    </div>
    <div class="tier-cards">${cards}</div>`;
    c.appendChild(sec);
  });
}

/* ===== STATS ===== */
function renderStats() {
  const c = document.getElementById('stats-content');
  const total = animes.length;
  const completed = animes.filter(a => a.status==='Completed').length;
  const watching = animes.filter(a => a.status==='Watching').length;
  const rated = animes.filter(a => a.rating>0);
  const avg = rated.length ? (rated.reduce((s,a)=>s+a.rating,0)/rated.length).toFixed(1) : '—';
  const totalEp = animes.reduce((s,a) => s+(parseInt(a.epWatched)||0), 0);
  const ytIdeas = animes.filter(a => a.ytIdeas && a.ytIdeas.trim()).length;

  // Genre breakdown
  const genreCount = {};
  animes.forEach(a => (a.genres||[]).forEach(g => genreCount[g] = (genreCount[g]||0)+1));
  const topGenres = Object.entries(genreCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxGenre = topGenres[0]?.[1]||1;

  // Rating distribution
  const ratingDist = Array.from({length:10},(_,i)=>animes.filter(a=>a.rating===i+1).length);
  const maxRD = Math.max(...ratingDist, 1);

  // Status breakdown
  const statusColors = { Completed:'#10b981', Watching:'#06b6d4', 'Plan to Watch':'#7c3aed', Dropped:'#ef4444', 'On Hold':'#f97316' };
  const statuses = ['Completed','Watching','Plan to Watch','Dropped','On Hold'];
  const statusLegend = statuses.map(s => {
    const n = animes.filter(a=>a.status===s).length;
    return `<div class="legend-item"><div class="legend-dot" style="background:${statusColors[s]}"></div>${s}: <strong>${n}</strong></div>`;
  }).join('');

  // Tier breakdown
  const tierCounts = ['S','A','B','C','D'].map(t => ({ t, n: animes.filter(a=>a.tier===t).length }));

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Anime</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#10b981">${completed}</div><div class="stat-label">Completed</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#06b6d4">${watching}</div><div class="stat-label">Watching</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#f59e0b">${avg}</div><div class="stat-label">Avg Rating</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#a78bfa">${totalEp.toLocaleString()}</div><div class="stat-label">Episodes Watched</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#e84393">${ytIdeas}</div><div class="stat-label">YouTube Ideas</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;flex-wrap:wrap">
      <div class="chart-section">
        <div class="chart-title">Top Genres</div>
        ${topGenres.length ? `<div class="bar-chart">${topGenres.map(([g,n])=>`<div class="bar-row"><div class="bar-label">${g}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/maxGenre*100)}%"></div></div><div class="bar-val">${n}</div></div>`).join('')}</div>` : '<div style="color:var(--text3);font-size:13px">No data yet</div>'}
      </div>
      <div class="chart-section">
        <div class="chart-title">Watch Status</div>
        <div class="donut-wrap"><div class="donut-legend">${statusLegend}</div></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      <div class="chart-section">
        <div class="chart-title">Rating Distribution</div>
        <div class="rating-dist">${ratingDist.map((n,i)=>`<div class="rd-bar-wrap"><div class="rd-bar" style="height:${Math.round(n/maxRD*80)}px"></div><div class="rd-label">${i+1}</div></div>`).join('')}</div>
      </div>
      <div class="chart-section">
        <div class="chart-title">Tier Breakdown</div>
        <div style="display:flex;flex-direction:column;gap:10px">${tierCounts.map(({t,n})=>`<div class="bar-row"><div class="bar-label" style="color:${TIER_COLORS[t]};font-weight:600;font-family:'Bebas Neue',sans-serif;font-size:18px;min-width:30px">${t}</div><div class="bar-track"><div class="bar-fill" style="width:${total?Math.round(n/total*100):0}%;background:${TIER_COLORS[t]}"></div></div><div class="bar-val">${n}</div></div>`).join('')}</div>
      </div>
    </div>`;
}

/* ===== TABS ===== */
function switchTab(tab) {
  ['library','tierlist','stats'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('hidden', t !== tab);
    document.querySelector(`.nav-tab[data-tab="${t}"]`).classList.toggle('active', t === tab);
  });
  if (tab === 'tierlist') renderTierList();
  if (tab === 'stats') renderStats();
}

/* ===== EXPORT/IMPORT ===== */
function exportData() {
  const blob = new Blob([JSON.stringify(animes, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'anilog-backup.json';
  a.click();
  showToast('Exported successfully');
}
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error();
      if (confirm(`Import ${data.length} anime? This will merge with your current list.`)) {
        const existingIds = new Set(animes.map(a => a.id));
        data.forEach(a => { if (!existingIds.has(a.id)) animes.push(a); });
        save(); renderLibrary(); renderTierList(); renderStats();
        showToast(`Imported ${data.length} anime`);
      }
    } catch { showToast('Invalid file format'); }
  };
  r.readAsText(file);
  e.target.value = '';
}

/* ===== UTILS ===== */
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

/* ===== KEYBOARD ===== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeDetail(); }
  if (e.key === 'n' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) openAddModal();
});

/* ===== INIT ===== */
updateHeaderStats();
renderLibrary();
</script>
</body>
